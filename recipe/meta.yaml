{% set name = "compas_pb" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/compas_pb-{{ version }}.tar.gz
  sha256: 116c1bf53cc34175345b507848b29f146e2ed853a987504ae96226e51dd992f5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=66.0
    - pip
  run:
    - python >={{ python_min }}
    - compas >=2,<3
    - protobuf >=6.31.1

test:
  imports:
    - compas_pb
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/gramaziokohler/compas_pb
  summary: Protobuf extension for COMPAS Data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - chenkasirer
